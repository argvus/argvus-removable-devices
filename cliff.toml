[changelog]
header = """
# Changelog

All notable changes to this project are documented here. This file is
generated from Conventional Commits with git-cliff (`make changelog`).
"""
body = """
{% if version %}## [{{ version | trim_start_matches(value=\"v\") }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }}
{% else %}## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute=\"group\") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {{ commit.message | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
ignore_commits = "^chore"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
]
sort_commits = "oldest"
